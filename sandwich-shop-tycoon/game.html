<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fff4d6">
  <title>Sandwich Shop Tycoon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff4d6;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      position: fixed;
    }
    #game {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // ===== mobile-first design canvas =====
    const DESIGN_W = 500;
    const DESIGN_H = 900;

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let dpr = 1;

    // ===== game state =====
    let frame = 0;
    let wobble = 0;           // how much the sandwich is shaking
    let hatLift = 0;          // hat hops up when tapped
    let pointerX = DESIGN_W / 2;
    let pointerY = DESIGN_H / 2;
    let particles = [];
    let popText = null;       // little "YUM!" text that pops up
    let tapCount = 0;

    // floating weird stuff drifting in the background
    const floaters = [];
    const floaterEmojis = ["🍅", "🧀", "🥒", "🥬", "🍞", "🥓", "🌶️", "🥚", "🥪", "👁️"];
    for (let i = 0; i < 9; i++) {
      floaters.push({
        x: Math.random() * DESIGN_W,
        y: Math.random() * DESIGN_H,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        emoji: floaterEmojis[Math.floor(Math.random() * floaterEmojis.length)],
        size: 22 + Math.random() * 18,
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.02,
        alpha: 0.25 + Math.random() * 0.25
      });
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      const cssW = window.innerWidth;
      const cssH = window.innerHeight;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + "px";
      canvas.style.height = cssH + "px";
      scale = Math.min(cssW / DESIGN_W, cssH / DESIGN_H);
      offsetX = (cssW - DESIGN_W * scale) / 2;
      offsetY = (cssH - DESIGN_H * scale) / 2;
    }

    function applyDesignTransform() {
      ctx.setTransform(
        scale * dpr, 0,
        0, scale * dpr,
        offsetX * dpr, offsetY * dpr
      );
    }

    function screenToDesign(clientX, clientY) {
      return {
        x: (clientX - offsetX) / scale,
        y: (clientY - offsetY) / scale
      };
    }

    // ===== main loop =====
    function tick() {
      frame++;

      // shrink the wobble over time so it calms down
      wobble *= 0.9;
      hatLift *= 0.88;

      // float the background snacks around (wrap edges)
      for (const f of floaters) {
        f.x += f.vx;
        f.y += f.vy;
        f.rot += f.spin;
        if (f.x < -30) f.x = DESIGN_W + 30;
        if (f.x > DESIGN_W + 30) f.x = -30;
        if (f.y < -30) f.y = DESIGN_H + 30;
        if (f.y > DESIGN_H + 30) f.y = -30;
      }

      // move the food explosion particles
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5; // gravity
        p.rot += p.spin;
        p.life -= 1;
      }
      particles = particles.filter(p => p.life > 0);

      // shrink the YUM popup
      if (popText) {
        popText.life -= 1;
        popText.y -= 1.2;
        if (popText.life <= 0) popText = null;
      }

      draw();
      requestAnimationFrame(tick);
    }

    function draw() {
      // wipe the whole real canvas in raw pixels
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#fff4d6";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // switch into design coords
      applyDesignTransform();

      // play area background
      ctx.fillStyle = "#ffe9a8";
      ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

      // weird polka dots in the background
      ctx.fillStyle = "rgba(255, 213, 79, 0.35)";
      for (let i = 0; i < 30; i++) {
        const dx = (i * 73) % DESIGN_W;
        const dy = (i * 131) % DESIGN_H;
        ctx.beginPath();
        ctx.arc(dx, dy, 14, 0, Math.PI * 2);
        ctx.fill();
      }

      // floating weird stuff (drifting snacks/eyeballs)
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const f of floaters) {
        ctx.save();
        ctx.globalAlpha = f.alpha;
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        ctx.font = f.size + "px -apple-system, Arial, sans-serif";
        ctx.fillText(f.emoji, 0, 0);
        ctx.restore();
      }

      // cozy brown border around the play area
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, DESIGN_W - 8, DESIGN_H - 8);

      // title at the top
      ctx.fillStyle = "#5d3a1a";
      ctx.font = "bold 28px -apple-system, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("🥪 Sandwich Shop Tycoon 🥪", DESIGN_W / 2, 60);

      // hint
      ctx.font = "16px -apple-system, Arial, sans-serif";
      ctx.fillStyle = "#8b5a2b";
      ctx.fillText("✨ tap the sandwich! ✨", DESIGN_W / 2, 88);

      // tap counter
      ctx.font = "bold 18px -apple-system, Arial, sans-serif";
      ctx.fillStyle = "#5d3a1a";
      ctx.textAlign = "left";
      ctx.fillText("Taps: " + tapCount, 20, 880);

      // draw the wobbling sandwich
      const sx = DESIGN_W / 2;
      const sy = DESIGN_H / 2 + 60;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(Math.sin(frame * 0.5) * wobble * 0.15);
      ctx.scale(1 + wobble * 0.05, 1 - wobble * 0.05);
      drawSandwich(0, 0);
      drawFace(0, 0);
      ctx.restore();

      // chef hat (hops up when tapped)
      drawChefHat(DESIGN_W / 2, DESIGN_H / 2 - 60 - hatLift * 30);

      // explosion particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / 60);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.font = p.size + "px -apple-system, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.emoji, 0, 0);
        ctx.restore();
      }

      // YUM popup
      if (popText) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, popText.life / 40);
        ctx.font = "bold 48px -apple-system, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#e53935";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 6;
        ctx.strokeText(popText.text, popText.x, popText.y);
        ctx.fillText(popText.text, popText.x, popText.y);
        ctx.restore();
      }
    }

    // ===== drawings =====
    function drawSandwich(cx, cy) {
      ctx.fillStyle = "rgba(0,0,0,0.15)";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 140, 200, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d9a066";
      ctx.fillRect(cx - 180, cy + 70, 360, 50);
      ctx.fillStyle = "#b8843f";
      ctx.fillRect(cx - 180, cy + 115, 360, 8);

      ctx.fillStyle = "#e57373";
      ctx.fillRect(cx - 190, cy + 50, 380, 25);

      ctx.fillStyle = "#ffd54f";
      ctx.beginPath();
      ctx.moveTo(cx - 195, cy + 35);
      ctx.lineTo(cx + 195, cy + 35);
      ctx.lineTo(cx + 180, cy + 55);
      ctx.lineTo(cx - 180, cy + 55);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#e53935";
      ctx.beginPath();
      ctx.arc(cx - 110, cy + 25, 26, 0, Math.PI * 2);
      ctx.arc(cx, cy + 25, 26, 0, Math.PI * 2);
      ctx.arc(cx + 110, cy + 25, 26, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#66bb6a";
      ctx.beginPath();
      ctx.moveTo(cx - 190, cy + 10);
      for (let x = -190; x <= 190; x += 30) {
        ctx.quadraticCurveTo(cx + x + 15, cy - 15, cx + x + 30, cy + 10);
      }
      ctx.lineTo(cx + 190, cy + 25);
      ctx.lineTo(cx - 190, cy + 25);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#d9a066";
      ctx.beginPath();
      ctx.moveTo(cx - 180, cy + 10);
      ctx.quadraticCurveTo(cx, cy - 100, cx + 180, cy + 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff8dc";
      const seeds = [
        [-110, -35], [-55, -58], [0, -68], [55, -58], [110, -35],
        [-80, -22], [25, -45], [80, -22]
      ];
      for (const [dx, dy] of seeds) {
        ctx.beginPath();
        ctx.ellipse(cx + dx, cy + dy, 4.5, 2.8, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // googly eyes + silly mouth, drawn on the top bun
    function drawFace(cx, cy) {
      const sandwichSX = DESIGN_W / 2;
      const sandwichSY = DESIGN_H / 2 + 60;
      drawEye(cx - 50, cy - 45, sandwichSX - 50, sandwichSY - 45);
      drawEye(cx + 50, cy - 45, sandwichSX + 50, sandwichSY - 45);

      // wonky open smile
      ctx.strokeStyle = "#3a1d0a";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(cx, cy - 18, 28, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      // tongue
      ctx.fillStyle = "#f06292";
      ctx.beginPath();
      ctx.ellipse(cx, cy - 2, 14, 7, 0, 0, Math.PI);
      ctx.fill();
      // tooth
      ctx.fillStyle = "#fff";
      ctx.fillRect(cx - 4, cy - 10, 7, 7);
    }

    function drawEye(localX, localY, worldX, worldY) {
      // eye white
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(localX, localY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#222";
      ctx.lineWidth = 2;
      ctx.stroke();

      // pupil looks toward the pointer in WORLD design coords
      const dx = pointerX - worldX;
      const dy = pointerY - worldY;
      const ang = Math.atan2(dy, dx);
      const dist = Math.min(8, Math.hypot(dx, dy) / 25);
      const px = localX + Math.cos(ang) * dist;
      const py = localY + Math.sin(ang) * dist;
      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI * 2);
      ctx.fill();
      // sparkle
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(px - 3, py - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawChefHat(cx, cy) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx - 70, cy - 10, 140, 25);
      ctx.fillStyle = "#e0e0e0";
      ctx.fillRect(cx - 70, cy + 12, 140, 3);

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx - 55, cy - 30, 45, 0, Math.PI * 2);
      ctx.arc(cx + 55, cy - 30, 45, 0, Math.PI * 2);
      ctx.arc(cx, cy - 55, 55, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#dcdcdc";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx - 55, cy - 30, 45, Math.PI, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + 55, cy - 30, 45, Math.PI, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy - 55, 55, Math.PI, Math.PI * 2);
      ctx.stroke();
    }

    // ===== tap / touch =====
    const SANDWICH_X = DESIGN_W / 2;
    const SANDWICH_Y = DESIGN_H / 2 + 60;

    function spawnParticles(x, y, count) {
      const emojis = ["🥪","🍅","🧀","🥒","🥬","🍞","🥓","✨","💫","🌟","❤️"];
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 14,
          vy: -Math.random() * 16 - 4,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          life: 60,
          rot: 0,
          spin: (Math.random() - 0.5) * 0.4,
          size: 26 + Math.random() * 14
        });
      }
    }

    function handleTap(designX, designY) {
      pointerX = designX;
      pointerY = designY;
      tapCount += 1;

      const dx = designX - SANDWICH_X;
      const dy = designY - SANDWICH_Y;
      const onSandwich = Math.abs(dx) < 200 && Math.abs(dy) < 160;

      if (onSandwich) {
        wobble = 1;
        hatLift = 1;
        spawnParticles(designX, designY, 14);
        const yums = ["YUM!", "MMM!", "DELISH!", "TASTY!", "OM NOM!"];
        popText = {
          text: yums[Math.floor(Math.random() * yums.length)],
          x: designX,
          y: designY - 100,
          life: 40
        };
      } else {
        spawnParticles(designX, designY, 6);
      }
    }

    canvas.addEventListener("pointerdown", e => {
      const p = screenToDesign(e.clientX, e.clientY);
      handleTap(p.x, p.y);
    });
    canvas.addEventListener("pointermove", e => {
      const p = screenToDesign(e.clientX, e.clientY);
      pointerX = p.x;
      pointerY = p.y;
    });

    // ===== mobile glue =====
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);
    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("dblclick", e => e.preventDefault());
    canvas.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

    resize();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
